<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordem de montagem — FIA</title>
<style>
/* ------------------------------------------------------------------
   Instrumento de trabalho, nao pagina: tem de caber numa tela, sem
   rolar. A paleta sai do material - o aluminio da chapa, o papel, e as
   quatro tintas de escala nos hexadecimais da industria. Cor aqui diz
   QUAL TINTA; nao e enfeite.
   ------------------------------------------------------------------ */
:root{
  --metal:#c6c4bb; --metal-esc:#a9a79e;
  --folha:#faf9f6; --fundo:#eceae4;
  --grafite:#24262a; --fraco:#6b6f76; --linha:#d8d5cc;
  --cian:#009ee0; --magenta:#e6007e; --amarelo:#ffed00; --preto:#1d1d1b;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--fundo); color:var(--grafite);
  font:13.5px/1.45 "Segoe UI Variable Text","Segoe UI",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1{margin:0; font-size:15px; font-weight:650; letter-spacing:.01em}

header{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:9px 16px; background:var(--grafite); color:var(--folha);
  border-bottom:2px solid var(--magenta);
}
header .sub{font-size:12px; color:#9ea3aa}
header .tintas{display:flex; gap:3px; margin-left:auto}
header .tintas i{width:11px; height:11px; border-radius:2px}

main{
  display:grid; gap:14px; padding:14px 16px; max-width:1180px; margin:0 auto;
  grid-template-columns:330px minmax(0,1fr); align-items:start;
}
@media (max-width:860px){
  main{grid-template-columns:1fr}
  .chapa-col{order:-1}
}

/* ---------- blocos: enxutos ---------- */
.bloco{background:var(--folha); border:1px solid var(--linha);
  border-radius:3px; padding:9px 10px; margin-bottom:9px}
.bloco[hidden]{display:none}
.rot{font-size:10.5px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--fraco); margin:0 0 6px}
.rot + .rot{margin-top:10px}

/* fichas de escolha: UMA linha cada */
.fichas{display:flex; flex-wrap:wrap; gap:5px}
.fichas button{
  padding:5px 9px; cursor:pointer; font:inherit; font-size:12.5px;
  background:#fff; border:1px solid var(--metal-esc); border-radius:3px;
  color:inherit; white-space:nowrap;
}
.fichas button:hover{border-color:var(--fraco)}
.fichas button[aria-pressed=true]{
  border-color:var(--magenta); box-shadow:inset 0 0 0 1px var(--magenta);
  background:#fff5fa; font-weight:600;
}
.fichas .med{font-family:var(--mono); font-size:11px; color:var(--fraco); margin-left:5px}
button[aria-pressed=true] .med{color:var(--magenta)}

.nums{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
.nums label{display:block; font-size:10.5px; color:var(--fraco); margin:0 0 2px}
input[type=number],input[type=text]{
  width:100%; padding:5px 6px; font:inherit; font-family:var(--mono);
  font-size:13px; color:inherit; background:#fff;
  border:1px solid var(--metal-esc); border-radius:3px;
}
:focus-visible{outline:2px solid var(--magenta); outline-offset:1px}

.marcas{display:flex; gap:12px; flex-wrap:wrap; font-size:12.5px}
.marcas label{display:flex; gap:5px; align-items:center}

/* ---------- a chapa ---------- */
.chapa-col{position:sticky; top:14px}
.painel{background:var(--folha); border:1px solid var(--linha);
  border-radius:3px; padding:12px}
svg#desenho{width:100%; height:auto; max-height:56vh; display:block}

.veredito{margin-top:9px; padding:7px 10px; border-radius:3px; font-size:12.5px}
.veredito.cabe{background:#eff6ef; border:1px solid #c2dcc2}
.veredito.nao{background:#fdeef4; border:1px solid #f2b8d2}
.veredito b{font-family:var(--mono)}

/* os numeros numa tira, nao numa tabela */
.tira{display:flex; flex-wrap:wrap; gap:0 18px; margin-top:9px;
  padding-top:9px; border-top:1px solid var(--linha); font-size:12px}
.tira div{display:flex; gap:6px}
.tira span{color:var(--fraco)}
.tira b{font-family:var(--mono); font-weight:500}

/* ---------- entrega ---------- */
.entrega{display:flex; gap:8px; align-items:stretch; margin-top:10px}
.arquivo{
  flex:1; display:flex; align-items:center; gap:8px; padding:8px 10px;
  border:1.5px dashed var(--metal-esc); border-radius:3px; background:#fff;
  cursor:pointer; font-size:12.5px; min-width:0;
}
.arquivo:hover{border-color:var(--magenta)}
.arquivo input{position:absolute; width:1px; height:1px; opacity:0}
.arquivo .quem{font-family:var(--mono); font-size:11.5px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.gerar{
  padding:8px 16px; cursor:pointer; background:var(--magenta); color:#fff;
  border:0; border-radius:3px; font:inherit; font-weight:650; white-space:nowrap;
}
.gerar:disabled{background:var(--metal-esc); cursor:not-allowed}
.gerar:hover:not(:disabled){background:#c80069}

pre.ordem{margin:9px 0 0; padding:10px; background:var(--grafite);
  color:#e9e7e2; border-radius:3px; font-family:var(--mono); font-size:11.5px;
  white-space:pre-wrap; max-height:34vh; overflow:auto}
.copiar{margin-top:6px; padding:6px 12px; cursor:pointer; font:inherit;
  font-size:12.5px; background:#fff; border:1px solid var(--grafite); border-radius:3px}
.pe{font-size:11.5px; color:var(--fraco); margin:8px 0 0}
@media (prefers-reduced-motion:no-preference){
  .fichas button,.gerar,.arquivo{transition:border-color .1s,background .1s}
}
</style>
</head>
<body>

<header>
  <h1>Ordem de montagem</h1>
  <span class="sub">o que a FIA precisa para impor a chapa</span>
  <span class="tintas" aria-hidden="true">
    <i style="background:var(--cian)"></i><i style="background:var(--magenta)"></i>
    <i style="background:var(--amarelo)"></i><i style="background:var(--preto)"></i>
  </span>
</header>

<main>
  <div>
    <section class="bloco">
      <p class="rot">Cliente</p>
      <div class="fichas" id="clientes"></div>
      <p class="rot">Chapa</p>
      <div class="fichas" id="chapas"></div>
    </section>

    <section class="bloco" id="b-peca">
      <p class="rot">A peça, de corte a corte</p>
      <div class="nums">
        <div><label for="pl">largura</label><input type="number" id="pl" value="150" step=".01"></div>
        <div><label for="pa">altura</label><input type="number" id="pa" value="210" step=".01"></div>
        <div><label for="sangria">sangria</label><input type="number" id="sangria" value="2.5" step=".5"></div>
        <div><label for="vao">vão</label><input type="number" id="vao" value="5" step=".5"></div>
      </div>
    </section>

    <section class="bloco" id="b-montagem">
      <p class="rot">Quantas peças</p>
      <div class="fichas" id="quantas"></div>
      <p class="rot">Tipo</p>
      <div class="fichas" id="tipos"></div>
      <div id="caixa-encontro" hidden>
        <p class="rot">Se encontram</p>
        <div class="fichas" id="encontros"></div>
      </div>
      <p class="rot">Cores</p>
      <div class="fichas" id="cores"></div>
    </section>

    <section class="bloco" id="b-marcas">
      <p class="rot">Marcas e observações</p>
      <div class="marcas">
        <label><input type="checkbox" id="m-corte" checked> corte</label>
        <label><input type="checkbox" id="m-registro" checked> registro</label>
        <label><input type="checkbox" id="m-escala" checked> escala de cor</label>
      </div>
      <input type="text" id="obs" style="margin-top:7px; font-family:inherit"
             placeholder="pinça pela aba de cola · sem marca de corte · …">
    </section>
  </div>

  <div class="chapa-col">
    <div class="painel">
      <svg id="desenho" viewBox="0 0 525 459" role="img" aria-labelledby="t"><title id="t">A montagem na chapa</title></svg>
      <div class="veredito cabe" id="veredito"><span id="v-txt"></span></div>
      <div class="tira" id="tira"></div>

      <div class="entrega">
        <label class="arquivo" for="arq">
          <input type="file" id="arq" accept=".pdf,.cdr,.ai">
          <span aria-hidden="true">📄</span>
          <span class="quem" id="nome-arq">Escolher o arquivo…</span>
        </label>
        <button class="gerar" id="gerar" disabled>Gerar imposição</button>
      </div>
      <pre class="ordem" id="ordem" hidden></pre>
      <button class="copiar" id="copiar" hidden>Copiar a ordem</button>
      <p class="pe">A montagem sai na <b>pasta do dia</b>, com <b>_MONTAGEM</b> no
      nome. Quem move para a <b>PARA CTP</b> é você, depois de revisar.</p>
    </div>
  </div>
</main>

<script>
/* Chapas e pincas: as mesmas do config.py e da lista da casa. */
const CLIENTES = {
  AMERICA:{nome:"América", chapas:[
    {id:"PM_52",l:525,a:459,pinca:60,preco:8, rotulo:"PM 52", quando:"até o formato 4"},
    {id:"MOZP_FT2",l:650,a:550,pinca:60,preco:12,rotulo:"MOZP", quando:"maior que F4, preto e branco"},
    {id:"SM_74",l:745,a:605,pinca:62,preco:12,rotulo:"SM 74", quando:"maior que F4, colorido"}]}
};
const QUANTAS=[{id:"2x1",cols:1,rows:2,rotulo:"2"},{id:"2x2",cols:2,rows:2,rotulo:"4"},
               {id:"4x2",cols:4,rows:2,rotulo:"8 (4×2)"},{id:"2x4",cols:2,rows:4,rotulo:"8 (2×4)"}];
const TIPOS=[{id:"bate-vira",rotulo:"Bate-vira"},{id:"frente-verso",rotulo:"Frente e verso"},
             {id:"so-frente",rotulo:"Só frente"}];
const ENCONTROS=[{id:"cabeca",rotulo:"Cabeça com cabeça"},{id:"pe",rotulo:"Pé com pé"}];
const CORES=[{id:"CMYK",rotulo:"CMYK",chapas:4},{id:"PB",rotulo:"Preto e branco",chapas:1},
             {id:"2",rotulo:"Duas cores",chapas:2}];
const MARCA_COMP=12, MARCA_FOLGA=3, ENC_REG=1, ENC_ESC=3;

const e = {cliente:CLIENTES.AMERICA, chapa:CLIENTES.AMERICA.chapas[0],
           quantas:QUANTAS[1], tipo:TIPOS[0], encontro:ENCONTROS[0],
           cor:CORES[0], arquivo:null};

function fichas(alvo, itens, ativo, escolher, texto){
  const c = document.getElementById(alvo); c.innerHTML="";
  itens.forEach(i=>{
    const b=document.createElement("button"); b.type="button";
    b.setAttribute("aria-pressed", i===ativo?"true":"false");
    b.innerHTML=texto(i);
    if(i.quando) b.title = "A escolha "+i.quando;
    b.onclick=()=>{escolher(i); montar();};
    c.appendChild(b);
  });
}

function pintar(){
  fichas("clientes", Object.values(CLIENTES), e.cliente,
    c=>{e.cliente=c; e.chapa=c.chapas[0];}, c=>c.nome);
  fichas("chapas", e.cliente.chapas, e.chapa, c=>{e.chapa=c;},
    c=>`${c.rotulo}<span class="med">${c.l}×${c.a}</span>`);
  fichas("quantas", QUANTAS, e.quantas, q=>{e.quantas=q;}, q=>q.rotulo);
  fichas("tipos", TIPOS, e.tipo, t=>{e.tipo=t;}, t=>t.rotulo);
  fichas("encontros", ENCONTROS, e.encontro, x=>{e.encontro=x;}, x=>x.rotulo);
  fichas("cores", CORES, e.cor, c=>{e.cor=c;}, c=>c.rotulo);
}

function contas(){
  const ch=e.chapa;
  const pl=+pl_.value||0, pa=+pa_.value||0, sg=+sangria_.value||0, vao=+vao_.value||0;
  const {cols,rows}=e.quantas;
  /* no bate-vira cabeca-com-cabeca as pecas giram 90 graus para as
     cabecas se encontrarem no vao - foi o que a montagem do flyer ensinou */
  const deitada = e.tipo.id==="bate-vira";
  const w = deitada?pa:pl, h = deitada?pl:pa;
  const larg = cols*w+(cols-1)*vao, alt = rows*h+(rows-1)*vao;
  const utilL=ch.l, utilA=ch.a-ch.pinca;
  const folga = MARCA_FOLGA+MARCA_COMP;
  const cabe = larg<=utilL && alt<=utilA;
  const marcasCabem = (larg+2*(sg+folga))<=ch.l && (ch.pinca+alt+sg+folga)<=ch.a;
  return {ch,pl,pa,sg,vao,cols,rows,w,h,larg,alt,utilL,utilA,cabe,marcasCabem,
          x0:(ch.l-larg)/2, y0:ch.pinca, deitada};
}

function desenhar(c){
  const s=document.getElementById("desenho"), ch=c.ch;
  s.setAttribute("viewBox",`-16 -16 ${ch.l+32} ${ch.a+32}`);
  const p=[`<defs><pattern id="h" width="7" height="7" patternUnits="userSpaceOnUse"
    patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7"
    stroke="var(--metal-esc)" stroke-width="2.5"/></pattern></defs>`];
  p.push(`<rect width="${ch.l}" height="${ch.a}" fill="var(--metal)" stroke="var(--metal-esc)"/>`);
  p.push(`<rect y="${ch.a-ch.pinca}" width="${ch.l}" height="${ch.pinca}" fill="url(#h)" opacity=".75"/>`);
  p.push(`<text x="6" y="${ch.a-ch.pinca/2+5}" font-size="14" font-family="var(--mono)"
    fill="var(--grafite)">pinça ${ch.pinca}</text>`);

  for(let L=0;L<c.rows;L++) for(let C=0;C<c.cols;C++){
    const x=c.x0+C*(c.w+c.vao), yb=c.y0+L*(c.h+c.vao), y=ch.a-yb-c.h;
    const verso = e.tipo.id==="bate-vira"
      ? (c.cols>1 ? C>=c.cols/2 : L>=c.rows/2) : false;
    p.push(`<rect x="${x-c.sg}" y="${y-c.sg}" width="${c.w+2*c.sg}"
      height="${c.h+2*c.sg}" fill="${verso?"#dde8f1":"#e5e1f1"}"/>`);
    p.push(`<rect x="${x}" y="${y}" width="${c.w}" height="${c.h}"
      fill="var(--folha)" stroke="var(--fraco)" stroke-width=".7"/>`);
    p.push(`<text x="${x+c.w/2}" y="${y+c.h/2+5}" text-anchor="middle"
      font-size="14" fill="var(--fraco)">${verso?"VERSO":"FRENTE"}</text>`);
  }

  if(mcorte.checked){
    const cima=ch.a-(c.y0+c.alt), baixo=ch.a-c.y0;
    for(let C=0;C<c.cols;C++) [c.x0+C*(c.w+c.vao), c.x0+C*(c.w+c.vao)+c.w].forEach(x=>{
      p.push(`<line x1="${x}" y1="${cima-MARCA_FOLGA}" x2="${x}" y2="${cima-MARCA_FOLGA-MARCA_COMP}" stroke="#111"/>`);
      p.push(`<line x1="${x}" y1="${baixo+MARCA_FOLGA}" x2="${x}" y2="${baixo+MARCA_FOLGA+MARCA_COMP}" stroke="#111"/>`);
    });
    for(let L=0;L<c.rows;L++) [c.y0+L*(c.h+c.vao), c.y0+L*(c.h+c.vao)+c.h].forEach(yb=>{
      const y=ch.a-yb;
      p.push(`<line x1="${c.x0-MARCA_FOLGA}" y1="${y}" x2="${c.x0-MARCA_FOLGA-MARCA_COMP}" y2="${y}" stroke="#111"/>`);
      p.push(`<line x1="${c.x0+c.larg+MARCA_FOLGA}" y1="${y}" x2="${c.x0+c.larg+MARCA_FOLGA+MARCA_COMP}" y2="${y}" stroke="#111"/>`);
    });
  }
  if(mregistro.checked){
    const ym=ch.a-(c.y0+c.alt/2);
    [c.x0-c.sg-ENC_REG-11, c.x0+c.larg+c.sg+ENC_REG+4].forEach(x=>
      p.push(`<g transform="translate(${x},${ym})" stroke="#111" fill="none">
        <circle r="5"/><line x1="-9" x2="9"/><line y1="-9" y2="9"/></g>`));
  }
  if(mescala.checked){
    const x=c.x0-c.sg-ENC_ESC-7, yt=ch.a-(c.y0+c.alt)+MARCA_FOLGA;
    ["var(--cian)","var(--magenta)","var(--amarelo)","var(--preto)"].forEach((cor,i)=>
      p.push(`<rect x="${x}" y="${yt+i*9}" width="7" height="8" fill="${cor}"/>`));
  }
  s.innerHTML=p.join("");
}

function relatar(c){
  const v=document.getElementById("veredito"), t=document.getElementById("v-txt");
  if(!c.cabe){
    v.className="veredito nao";
    t.innerHTML=`<b>Não cabe.</b> A montagem pede <b>${c.larg.toFixed(1)}×${c.alt.toFixed(1)}</b>;
      a chapa dá <b>${c.utilL}×${c.utilA}</b> depois da pinça.`;
  } else if(!c.marcasCabem){
    v.className="veredito nao";
    t.innerHTML=`Cabe, <b>mas as marcas não</b> — elas pedem ${MARCA_FOLGA+MARCA_COMP} mm além da sangria.`;
  } else {
    v.className="veredito cabe";
    t.innerHTML=`<b>Cabe.</b> Sobram <b>${(c.utilL-c.larg).toFixed(1)}</b> na largura,
      <b>${(c.utilA-c.alt).toFixed(1)}</b> na altura.`;
  }
  const nchapas = e.cor.chapas * (e.tipo.id==="frente-verso"?2:1);
  document.getElementById("tira").innerHTML = [
    ["montagem", `${c.larg.toFixed(1)} × ${c.alt.toFixed(1)} mm`],
    ["1º corte", `${c.y0} mm do pé`],
    ["margem", `${c.x0.toFixed(1)} mm`],
    ["chapas", `${nchapas} × R$ ${c.ch.preco.toFixed(2)} = R$ ${(nchapas*c.ch.preco).toFixed(2)}`],
  ].map(([k,val])=>`<div><span>${k}</span><b>${val}</b></div>`).join("");
}

function ordem(c){
  const m=[]; if(mcorte.checked)m.push("corte"); if(mregistro.checked)m.push("registro");
  if(mescala.checked)m.push("escala de cor");
  const o=obs_.value.trim();
  return ["MONTAGEM",
    `cliente   ${e.cliente.nome}`,
    `chapa     ${c.ch.rotulo} — ${c.ch.l}×${c.ch.a}, pinça ${c.ch.pinca} mm`,
    `arquivo   ${e.arquivo?e.arquivo.name:"(não escolhido)"}`,
    `peça      ${c.pl} × ${c.pa} mm de corte`,
    `sangria   ${c.sg} mm, já no arquivo`,
    `vão       ${c.vao} mm`,
    `arranjo   ${e.quantas.rotulo} peças, ${c.cols}×${c.rows}`,
    `tipo      ${e.tipo.rotulo}${e.tipo.id==="bate-vira"?" — "+e.encontro.rotulo.toLowerCase():""}`,
    `cores     ${e.cor.rotulo}`,
    `marcas    ${m.join(", ")||"nenhuma"}`,
    o?`obs       ${o}`:null, "",
    `Dá ${c.larg.toFixed(1)} × ${c.alt.toFixed(1)} mm de corte a corte, 1º corte a ${c.y0} mm do pé.`,
    "Pode gerar a imposição."].filter(Boolean).join("\n");
}

function montar(){
  document.getElementById("caixa-encontro").hidden = e.tipo.id!=="bate-vira";
  pintar();
  const c=contas(); desenhar(c); relatar(c);
  document.getElementById("gerar").disabled = !(c.cabe && e.arquivo);
}

const pl_=document.getElementById("pl"), pa_=document.getElementById("pa"),
      sangria_=document.getElementById("sangria"), vao_=document.getElementById("vao"),
      obs_=document.getElementById("obs"), mcorte=document.getElementById("m-corte"),
      mregistro=document.getElementById("m-registro"), mescala=document.getElementById("m-escala");
[pl_,pa_,sangria_,vao_].forEach(i=>i.addEventListener("input",montar));
[mcorte,mregistro,mescala].forEach(i=>i.addEventListener("change",montar));

document.getElementById("arq").addEventListener("change",ev=>{
  e.arquivo=ev.target.files[0]||null;
  document.getElementById("nome-arq").textContent=e.arquivo?e.arquivo.name:"Escolher o arquivo…";
  montar();
});
document.getElementById("gerar").addEventListener("click",()=>{
  const pre=document.getElementById("ordem");
  pre.textContent=ordem(contas()); pre.hidden=false;
  document.getElementById("copiar").hidden=false;
});
document.getElementById("copiar").addEventListener("click",async ev=>{
  try{ await navigator.clipboard.writeText(document.getElementById("ordem").textContent);
       ev.target.textContent="Copiado"; }
  catch(_){ const r=document.createRange(); r.selectNodeContents(document.getElementById("ordem"));
       getSelection().removeAllRanges(); getSelection().addRange(r);
       ev.target.textContent="Selecionado — Ctrl+C"; }
  setTimeout(()=>{ev.target.textContent="Copiar a ordem";},1600);
});

montar();
</script>
</body>
</html>
